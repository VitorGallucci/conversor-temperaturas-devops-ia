name: Agente IA - revisar testes e abrir PR
on: [workflow_dispatch]
permissions:
  contents: write
  pull-requests: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: IA revisa e gera novos testes e release notes
        env:
          GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
        run: python -m scripts.ai_improve
      - run: python -m ruff check tests/test_ai_generated.py --fix && python -m ruff format tests/test_ai_generated.py
      - run: python -m pytest --cov=conversor --cov-fail-under=90
      - name: Criar branch, commit e PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="codex/ai-tests-$GITHUB_RUN_ID"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_ai_generated.py docs/AI_RELEASE_NOTES.md
          git commit -m "test: ampliar regressões propostas pela IA"
          git push origin "$BRANCH"
          gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" --title "test: ampliar cobertura com revisão da IA" --body-file docs/AI_RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revisao-ia
          path: build/ai-review.json

